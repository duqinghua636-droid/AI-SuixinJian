
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI随心剪</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131c;color:white;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 padding:20px;
}
header{text-align:center;padding:15px}
h1{color:#8b7cff;font-size:28px}
p{color:#aeb4c5}
.card{
 background:#1c2231;padding:18px;
 border-radius:16px;margin:16px 0;
}
button,.upload{
 display:block;width:100%;padding:14px;
 border:0;border-radius:12px;
 background:#7867f5;color:white;
 font-size:16px;margin-top:12px;
}
input[type=file]{width:100%;margin:12px 0}
video{width:100%;border-radius:12px;background:black}
input[type=range]{width:100%}
.time{display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
<h1>✂️ AI 随心剪</h1>
<p>让视频剪辑变得简单</p>
</header>

<div class="card">
<h3>📁 上传视频</h3>
<input type="file" id="file" accept="video/*" multiple>
<p id="status">请选择手机中的视频</p>
</div>

<div class="card">
<h3>🎬 视频预览</h3>
<video id="video" controls playsinline></video>
</div>

<div class="card">
<h3>✂️ 剪辑设置</h3>
<p>开始时间（秒）</p>
<input type="range" id="start" min="0" max="100" value="0">
<div class="time"><span>开始</span><b id="startText">0 秒</b></div>

<p>结束时间（秒）</p>
<input type="range" id="end" min="0" max="100" value="100">
<div class="time"><span>结束</span><b id="endText">0 秒</b></div>

<button id="preview">▶ 预览剪辑片段</button>
</div>

<div class="card">
<h3>🚀 AI 随心剪</h3>
<p>第一版基础剪辑工具已启动。</p>
<p>后续将加入 AI 智能剪辑、自动字幕、音乐匹配和视频导出。</p>
</div>

<script>
const file=document.getElementById('file');
const video=document.getElementById('video');
const start=document.getElementById('start');
const end=document.getElementById('end');
let videoURL=null;

file.addEventListener('change',()=>{
 const f=file.files[0];
 if(!f)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;
 document.getElementById('status').textContent='已选择：'+f.name;
});

video.addEventListener('loadedmetadata',()=>{
 const d=video.duration;
 start.max=d;
 end.max=d;
 start.value=0;
 end.value=d;
 update();
});

function update(){
 document.getElementById('startText').textContent=
 Number(start.value).toFixed(1)+' 秒';
 document.getElementById('endText').textContent=
 Number(end.value).toFixed(1)+' 秒';
}

start.addEventListener('input',update);
end.addEventListener('input',update);

document.getElementById('preview').onclick=()=>{
 if(!video.src)return alert('请先上传视频');
 if(Number(start.value)>=Number(end.value))
 return alert('结束时间必须大于开始时间');
 video.currentTime=Number(start.value);
 video.play();
};

video.addEventListener('timeupdate',()=>{
 if(video.currentTime>=Number(end.value)&&!video.paused){
 video.pause();
 }
});
</script>
</body>
</html>
